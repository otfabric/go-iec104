name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-iec104 against the reference implementations published by
# otfabric/iec104-interop, as client and as server. The images are consumed as
# published: nothing of iec104-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      lib60870_image:
        description: "lib60870 reference image (default: the pinned release)"
        required: false
      openmuc_image:
        description: "OpenMUC j60870 reference image (default: the pinned release)"
        required: false
      wendy512_image:
        description: "wendy512/iec104 reference image (default: the pinned release)"
        required: false
      cbsigma_image:
        description: "cB-Sigma/iec60870 reference image, with IEC 62351-5 (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # The full set of references runs here: a procedure that none of them declares
  # fails, it does not skip.
  IEC104_REQUIRE_INTEROP: "1"
  # otfabric/iec104-interop v0.5.0: lib60870-C v2.4.1, OpenMUC j60870 1.8.0,
  # wendy512/iec104 v1.0.4 on go-iecp5 v1.2.6, cB-Sigma/iec60870 v0.3.0.
  # Keep in step with the Makefile and interop/harness.go.
  IEC104_INTEROP_LIB60870_IMAGE: ${{ inputs.lib60870_image || 'ghcr.io/otfabric/iec104-interop-lib60870@sha256:c1f0cc95e39316df8c182b887b933e0488c92845fedade00605aedc816a0af9a' }}
  IEC104_INTEROP_OPENMUC_IMAGE: ${{ inputs.openmuc_image || 'ghcr.io/otfabric/iec104-interop-openmuc@sha256:319061ebfddd5bd87893dc87d065ab091c8ac9f2a2f3ce57838b5b7c9663766f' }}
  IEC104_INTEROP_WENDY512_IMAGE: ${{ inputs.wendy512_image || 'ghcr.io/otfabric/iec104-interop-wendy512@sha256:8b8c9314ceef122d29ff1bd56b98a971c3dc0585522d8b81586d99119297c397' }}
  IEC104_INTEROP_CBSIGMA_IMAGE: ${{ inputs.cbsigma_image || 'ghcr.io/otfabric/iec104-interop-cbsigma@sha256:43e8e0db63fe3ab49ccca659e1ade8bcced43b916ba2fca161b03cc35aa779a8' }}

jobs:
  interop:
    name: lib60870 + OpenMUC + wendy512 + cB-Sigma, client and server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Pull reference images
        run: |
          images=("${IEC104_INTEROP_LIB60870_IMAGE}" "${IEC104_INTEROP_OPENMUC_IMAGE}" "${IEC104_INTEROP_WENDY512_IMAGE}" "${IEC104_INTEROP_CBSIGMA_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq --filter name=go-iec104-interop); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: artifacts/
          if-no-files-found: ignore

  # The application-layer security (IEC 62351-5) against cB-Sigma/iec60870,
  # in process: interop/cbsigma is a module of its own, so that go-iec104
  # keeps no dependencies, and cB-Sigma needs Go 1.26.
  cbsigma:
    name: cB-Sigma (IEC 62351-5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: interop/cbsigma/go.sum
      - run: make test-cbsigma
