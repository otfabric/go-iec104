name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.1.1
    with:
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      # Same scope as TEST_PKGS in the Makefile: the fixture and test helper packages have no tests of their own.
      test-exclude-regex: "/example(s)?($|/)|/internal/(station|testutil)$"
      codecov-name: go-iec104
      go-versions: '["1.23", "1.24", "1.25", "1.26"]'
    secrets: inherit

  # The self-contained examples must keep running as they are.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: make build examples
